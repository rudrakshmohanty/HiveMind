services:

  mongo:
    image: mongo:7
    container_name: hivemind-mongo
    volumes:
      - mongo_data:/data/db
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  ollama:
    image: ollama/ollama:latest
    container_name: hivemind-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_models:/root/.ollama
    environment:
      - OLLAMA_HOST=0.0.0.0:11434
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: hivemind-backend
    ports:
      - "8000:8000"
    depends_on:
      mongo:
        condition: service_healthy
      ollama:
        condition: service_healthy
    environment:
      - OLLAMA_BASE_URL=http://hivemind-ollama:11434
      - MONGODB_URL=mongodb://hivemind-mongo:27017
      - MONGODB_DB=hivemind
      - EMBED_MODEL=${EMBED_MODEL:-nomic-embed-text}
      - CHROMA_PATH=/app/chroma_db
    volumes:
      - chroma_data:/app/chroma_db
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  frontend:
    build:
      context: .                        # root — needed for ../assets in vite.config
      dockerfile: frontend/Dockerfile
    container_name: hivemind-frontend
    ports:
      - "5173:80"                       # nginx serves on 80 inside container
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  ollama_models:
  mongo_data:
  chroma_data:
